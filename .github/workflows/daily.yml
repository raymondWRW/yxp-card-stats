name: Daily data refresh

# Folds the new HuggingFace replay shards into the Season-9 stats and commits the
# refreshed data/ JSON so GitHub Pages serves up-to-date stats. Runs every day and can
# also be triggered manually from the Actions tab.
#
# The extraction is INCREMENTAL: the accumulated state lives in the Actions cache
# (restored below, saved after the run -- also after a cancelled/timed-out run, thanks
# to the script's periodic checkpoints). No cache = full rebuild (~2 h); with it a daily
# run only scans the ~30 new shards (minutes).
on:
  schedule:
    - cron: "0 8 * * *" # 08:00 UTC daily
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: daily-refresh
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    # Only a cold full rebuild needs this long (~30 shards/min, 2400+ shards); a
    # checkpointed state survives a timeout, so the next run resumes where it stopped.
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r pipeline/requirements.txt

      - name: Restore extraction state
        uses: actions/cache/restore@v4
        with:
          path: state/season9_state.pkl.zst
          key: s9-state-${{ github.run_id }}
          restore-keys: |
            s9-state-

      - name: Run extraction
        env:
          YXP_PROXY: ${{ github.workspace }}/pipeline
          YXP_OUTDIR: ${{ github.workspace }}/data
          YXP_STATE: ${{ github.workspace }}/state/season9_state.pkl.zst
        run: python -u pipeline/season9_builds.py full

      - name: Commit refreshed data if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/season9.json data/season9_builds.json data/season9_fates.json
          if git diff --cached --quiet; then
            echo "No data changes today."
          else
            git commit -m "Daily data refresh ($(date -u +%Y-%m-%d))"
            # main may have moved during the ~1h extraction; rebase so the push
            # isn't rejected as non-fast-forward (only this job writes data/*.json)
            git pull --rebase origin main
            git push
          fi

      # New cache entry per run (entries are immutable); restore-keys above picks the
      # newest. always(): a cancelled run still saves its last checkpoint.
      - name: Save extraction state
        if: always() && hashFiles('state/season9_state.pkl.zst') != ''
        uses: actions/cache/save@v4
        with:
          path: state/season9_state.pkl.zst
          key: s9-state-${{ github.run_id }}
