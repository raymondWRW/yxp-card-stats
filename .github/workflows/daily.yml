name: Daily data refresh

# Converts the new HuggingFace replay shards into the Parquet dataset, folds them into
# per-day statistics (pipeline/daily_stats.py -> data/daily/), combines all days/weeks
# into the site JSON and commits both, so GitHub Pages serves up-to-date stats. Runs
# every day and can also be triggered manually from the Actions tab. The season lives in
# pipeline/season_builds.py (SEASON, currently 10); season9*.json stays frozen.
#
# Only days whose source shards changed are recomputed (normally today + yesterday);
# finished weeks are compacted. No state cache: data/daily/ in the repo is the state.
on:
  schedule:
    - cron: "0 8 * * *" # 08:00 UTC daily
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: daily-refresh
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    # Only the first run (every day of the season) takes long; it stops building days
    # after YXP_DAILY_BUDGET_MIN, commits them, and the next run continues.
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r pipeline/requirements.txt

      # New source shards -> Parquet dataset (only chunks of the current season; a chunk is
      # 50 shards, so the still-filling tail chunk is simply rebuilt). The extraction below
      # then reads the Parquet dataset instead of the raw tar.zst shards.
      - name: Convert new replay shards to Parquet
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
          TARGET: www1234567890/Yi_Xian_Replay_Compressed
        run: |
          jobs=$(python pipeline/convert_to_parquet.py plan --target "$TARGET" --per-job 1000 --min-chunk 668)
          chunks=$(python -c "import json,sys; print(*[c for j in json.loads(sys.argv[1]) for c in j])" "$jobs")
          echo "chunks to convert: ${chunks:-none}"
          if [ -n "$chunks" ]; then
            python -u pipeline/convert_to_parquet.py run --target "$TARGET" --chunks $chunks
          fi

      - name: Build daily statistics and site data
        env:
          YXP_PROXY: ${{ github.workspace }}/pipeline
          YXP_OUTDIR: ${{ github.workspace }}/data
          YXP_PARQUET: www1234567890/Yi_Xian_Replay_Compressed
          YXP_DAILY_BUDGET_MIN: "120"
          YXP_SPLIT_VARIANTS: "1"                   # per-strategy sub-builds (strategy_signatures.json + fate rules)
          HF_TOKEN: ${{ secrets.HF_TOKEN }}          # authenticated reads: higher rate limits
          HF_HUB_DOWNLOAD_TIMEOUT: "60"
        # [mem] lines every 30s, so a memory problem is visible in the log
        run: |
          ( while sleep 30; do echo "[mem] $(date -u +%H:%M:%S) $(free -m | awk '/Mem:/{print "used "$3" / "$2" MB, avail "$7}')"; done ) &
          python -u pipeline/daily_stats.py

      # Elo leaderboard (pipeline/elo): rates only source shards it hasn't rated yet, read from
      # the Parquet dataset. Its state lives in the Actions cache; if that entry has expired the
      # permanent `elo-state-seed` release is used and the missed shards are simply rated now
      # (the state records which shards it has processed). Never blocks the data refresh.
      - name: Restore Elo state
        if: ${{ !cancelled() }}                   # Elo doesn't depend on the stats step
        uses: actions/cache/restore@v4
        with:
          path: state/elo_state.pkl.zst
          key: elo-state-${{ github.run_id }}
          restore-keys: |
            elo-state-

      - name: Update Elo leaderboard
        if: ${{ !cancelled() }}
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
          HF_HUB_DOWNLOAD_TIMEOUT: "60"
          YXP_ELO_STATE: ${{ github.workspace }}/state/elo_state.pkl.zst
          YXP_ELO_OUT: ${{ github.workspace }}/data/elo
        run: |
          mkdir -p state
          if [ ! -f state/elo_state.pkl.zst ]; then
            echo "no cached Elo state: starting from the elo-state-seed release"
            gh release download elo-state-seed --repo "$GITHUB_REPOSITORY" --pattern elo_state.pkl.zst --dir state
          fi
          python -u pipeline/elo/update.py

      - name: Save Elo state
        if: always() && hashFiles('state/elo_state.pkl.zst') != ''
        uses: actions/cache/save@v4
        with:
          path: state/elo_state.pkl.zst
          key: elo-state-${{ github.run_id }}

      # Vendored yxp_wiki card renderer (used with permission): re-copy it so new cards and
      # renderer fixes reach the site. A wiki outage must not block the data refresh.
      - name: Sync yxp_wiki card renderer
        if: ${{ !cancelled() }}
        continue-on-error: true
        run: python pipeline/sync_card_renderer.py .

      # Commits whatever finished (Elo / renderer still land if the stats step failed;
      # a failed stats build never reaches write_output, so it leaves no partial site JSON).
      - name: Commit refreshed data if changed
        if: ${{ !cancelled() }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/season10.json data/season10_builds.json data/season10_fates.json
          git add -A data/daily
          git add -A vendor/card-components
          git add -A data/elo
          if git diff --cached --quiet; then
            echo "No data changes today."
          else
            git commit -m "Daily data refresh ($(date -u +%Y-%m-%d))"
            # main may have moved during the run; rebase so the push isn't rejected as
            # non-fast-forward (only this job writes data/*.json and data/daily/)
            git pull --rebase origin main
            git push
          fi
