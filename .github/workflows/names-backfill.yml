name: Names table backfill (one-off)

# Uploads names/c<chunk>.parquet for chunks converted before the names table existed.
# The files were built locally from the players' own replays (elo/names_backfill.py) and
# attached to the temporary release `names-backfill-tmp`. Skips chunks that already have a
# names file, so a rerun is safe. Delete this workflow and the release once it has run.
on: workflow_dispatch

jobs:
  upload:
    runs-on: ubuntu-latest
    steps:
      - name: Download the names files
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release download names-backfill-tmp --repo "$GITHUB_REPOSITORY" --pattern names_backfill.zip
          unzip -q names_backfill.zip && ls names | wc -l
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - run: pip install huggingface_hub
      - name: Upload to the dataset (40 chunks per commit)
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: |
          python - <<'PY'
          import glob, os, time
          from huggingface_hub import HfApi, CommitOperationAdd
          T = "www1234567890/Yi_Xian_Replay_Compressed"
          api = HfApi(token=os.environ["HF_TOKEN"])
          have = {f.path for f in api.list_repo_tree(T, repo_type="dataset", recursive=True) if f.path.startswith("names/")}
          files = [f for f in sorted(glob.glob("names/c*.parquet")) if f not in have]
          print(len(files), "to upload;", len(have), "already there")
          for i in range(0, len(files), 40):
              ops = [CommitOperationAdd(f, f) for f in files[i:i + 40]]
              for a in range(8):
                  try:
                      api.create_commit(T, ops, repo_type="dataset", commit_message=f"names table backfill ({len(ops)} chunks)")
                      break
                  except Exception as e:
                      print("retry", a, e); time.sleep(60 * (a + 1))
              else:
                  raise SystemExit("upload failed")
              print("uploaded", i + len(ops))
          PY
